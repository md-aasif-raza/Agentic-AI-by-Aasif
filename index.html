<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aasif's Gemini Agent 🤖</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-gray-100 min-h-screen flex flex-col items-center p-6">

    <div class="max-w-3xl w-full bg-[#1e293b] rounded-3xl shadow-2xl p-8 border border-cyan-500/20">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                Aasif's Agentic AI 🚀
            </h1>
            <p class="text-gray-400 mt-2">Powered by Gemini | Created by Aasif Raza</p>
        </div>

        <div class="bg-[#334155] p-4 rounded-xl mb-6">
            <label class="block text-xs font-bold uppercase tracking-wider text-cyan-400 mb-2">Gemini API Key (Free):</label>
            <input type="password" id="geminiKey" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-2 focus:ring-2 focus:ring-cyan-500 outline-none transition" placeholder="Paste your API Key here...">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-semibold mb-2 text-gray-300">Aapka Task Kya Hai?</label>
            <textarea id="taskInput" rows="3" class="w-full bg-[#0f172a] border border-gray-600 rounded-xl px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="E.g. Ek 30-day coding plan banao..."></textarea>
        </div>

        <button onclick="runGeminiAgent()" id="btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95">
            Launch Agent ⚡
        </button>

        <div id="loading" class="hidden mt-8 space-y-4">
            <div class="flex items-center space-x-3 text-cyan-400 animate-pulse">
                <span>🔄</span>
                <p id="statusText">Agent is thinking...</p>
            </div>
        </div>

        <div id="outputContainer" class="hidden mt-8 bg-[#0f172a] p-6 rounded-2xl border border-gray-700">
            <h3 class="text-lg font-bold text-cyan-400 mb-4 flex items-center justify-between">
                Final Result
                <button onclick="copyOutput()" class="text-xs bg-gray-700 px-2 py-1 rounded hover:bg-gray-600">Copy</button>
            </h3>
            <div id="finalOutput" class="text-gray-300 whitespace-pre-wrap leading-relaxed"></div>
        </div>

        <!-- OTP Generator Section -->
        <div class="mt-8 bg-[#1e3a5f] p-6 rounded-2xl border border-cyan-500/30">
            <h3 class="text-lg font-bold text-cyan-400 mb-4">🔐 OTP Generator</h3>
            <div class="flex items-center gap-4 mb-4">
                <label class="text-sm text-gray-300 whitespace-nowrap">OTP Length:</label>
                <input type="number" id="otpLength" min="4" max="8" value="6"
                    class="w-20 bg-[#0f172a] border border-gray-600 rounded-lg px-3 py-2 text-center focus:ring-2 focus:ring-cyan-500 outline-none">
                <button onclick="generateOTP()"
                    class="flex-1 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-500 hover:to-teal-500 text-white font-bold py-2 rounded-xl shadow transition active:scale-95">
                    Generate OTP ⚡
                </button>
            </div>
            <div id="otpResult" class="hidden bg-[#0f172a] rounded-xl p-4 flex items-center justify-between">
                <span id="otpValue" class="text-3xl font-mono font-extrabold tracking-widest text-cyan-300"></span>
                <button onclick="copyOTP()" class="text-xs bg-gray-700 px-3 py-1 rounded hover:bg-gray-600">Copy</button>
            </div>
        </div>
    </div>

    <script>
        async function runGeminiAgent() {
            const key = document.getElementById('geminiKey').value;
            const prompt = document.getElementById('taskInput').value;
            const btn = document.getElementById('btn');
            const outputContainer = document.getElementById('outputContainer');
            const statusText = document.getElementById('statusText');

            if(!key || !prompt) return alert("Pahle API Key aur Task toh daal Aasif bhai!");

            btn.disabled = true;
            document.getElementById('loading').classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                // Agent Logic Simulation
                statusText.innerText = "Analyzing requirements...";
                await new Promise(r => setTimeout(r, 1000));
                statusText.innerText = "Processing through Gemini Brain...";

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `You are an expert AI Agent. Task: ${prompt}. Answer in Hinglish and be professional.` }] }]
                    })
                });

                const data = await response.json();
                const result = data.candidates[0].content.parts[0].text;

                document.getElementById('finalOutput').innerText = result;
                outputContainer.classList.remove('hidden');
            } catch (error) {
                console.error(error);
                alert("Ouch! Something went wrong. Check API Key or Internet.");
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function copyOutput() {
            const text = document.getElementById('finalOutput').innerText;
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard!");
        }

        function generateOTP() {
            const length = parseInt(document.getElementById('otpLength').value);
            if (isNaN(length) || length < 4 || length > 8) {
                alert("OTP length must be between 4 and 8.");
                return;
            }
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            const otp = Array.from(array).map(n => n % 10).join('');
            document.getElementById('otpValue').innerText = otp;
            document.getElementById('otpResult').classList.remove('hidden');
        }

        function copyOTP() {
            const otp = document.getElementById('otpValue').innerText;
            navigator.clipboard.writeText(otp);
            alert("OTP copied to clipboard!");
        }
    </script>
</body>
</html>
